<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1c47a0">
<title>PNC 협력사</title>
<!-- ★폰 홈 화면에 추가하면 앱처럼 전체화면으로 열린다.
     아이폰은 '홈 화면에 추가'를 해야 알림도 받을 수 있다(3단계 웹푸시 대비). -->
<link rel="manifest" href="/partner.webmanifest">
<link rel="apple-touch-icon" href="/partner-icon.svg">
<link rel="icon" href="/partner-icon.svg">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PNC 협력사">
<meta name="mobile-web-app-capable" content="yes">
<meta name="format-detection" content="telephone=no">
<!--
  협력사 포털 — 2026-08-29 신설 / ★2026-09-03 「내부 ERP 화면 직접 재사용」으로 전환

  ★★★ 이 페이지는 협력사 화면을 **새로 그리지 않는다.**
       내부 ERP(index.html)가 쓰는 css/app.css · js/core.js · js/screens.etc.js 를 **그대로 로드**하고
       SCREEN.partnerplan / SCREEN.deliv420 / SCREEN.delivedit / SCREEN.sagubledger 를 직접 호출한다.
       ⟹ 화면이 한 벌만 존재한다. 내부 ERP 를 고치면 포털도 같이 고쳐진다.

       (경위) 처음엔 포털에 같은 화면을 다시 짰다(viewPPlan·viewDeliv·viewSledg).
       화면이 두 벌이 되어 한쪽만 고쳐지면 갈라진다 — 사용자 지적으로 전부 폐기하고 재사용으로 바꿨다.

  · boot.js 는 로드하지 않는다 = 내부 메뉴 트리·탭 UI 가 안 딸려온다(포털 자체 상단 메뉴를 쓴다).
  · core.js 의 즉시실행 4곳은 전부 안전(fetch 토큰래퍼·스피너CSS·오토컴플리트·컬럼리사이저).
    index.html 전용 DOM 을 찾지 않는다(조사 확인 2026-09-03).
  · 소속 제한은 **서버가** 한다 — auth.scope_cust() 가 협력사면 partner_code 로 강제하고,
    내부 직원이면 전 거래처를 준다. 레거시와 같은 방식이라 화면은 손대지 않는다.
  · 백엔드는 COOP_ALLOW 화이트리스트로 이미 막혀 있다 — 이 페이지는 그 안에서만 논다.
  정본 = _schema/PARTNER_PORTAL_DESIGN.md §3
-->
<!-- ★내부 ERP 자산 — 화면 재사용의 전부. index.html 과 같은 파일·같은 캐시버전을 쓴다. -->
<link rel="stylesheet" href="css/app.css?v=260827h100">
<style>
  :root{
    --bg:#f4f6fa; --card:#fff; --line:#e3e8f0; --ink:#16305c; --sub:#7c8aa5;
    --brand:#1c47a0; --brand2:#2f6db3; --ok:#1c8b57; --warn:#c77700; --bad:#c0392b;
    --r:14px; --sh:0 1px 3px rgba(20,40,80,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 -apple-system,BlinkMacSystemFont,"Malgun Gothic","맑은 고딕",sans-serif}
  body{padding-bottom:calc(64px + env(safe-area-inset-bottom))}
  .hide{display:none!important}

  /* ── 상단바 ── */
  header{position:sticky;top:0;z-index:30;background:var(--brand);color:#fff;
    padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px}
  header .t{font-weight:800;font-size:16px;letter-spacing:-.2px}
  header .c{margin-left:auto;font-size:12.5px;opacity:.92;text-align:right;line-height:1.25}
  header button{background:rgba(255,255,255,.16);color:#fff;border:0;border-radius:8px;
    padding:6px 10px;font-size:12px;font-weight:700}

  /* ── 하단 탭 (모바일) ── */
  nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:#fff;border-top:1px solid var(--line);
    display:flex;padding-bottom:env(safe-area-inset-bottom)}
  nav button{flex:1;background:none;border:0;padding:9px 2px 8px;color:var(--sub);
    font-size:11.5px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:3px}
  nav button .i{font-size:19px;line-height:1}
  nav button.on{color:var(--brand)}

  /* ★#app 만 — #erp 도 <main> 이라 그냥 `main` 으로 쓰면 내부 화면이 720px 로 잘린다 */
  main#app{padding:12px 12px 6px;max-width:720px;margin:0 auto}
  /* ★app.css 에 `html,body,#app{height:100%}` 가 있다 — 내부 ERP 에선 #app 이 최상위 셸이지만
       포털에선 #app 이 **자체화면 컨테이너**라 이름만 겹친다. 100% 를 그대로 받으면 flex 배치가
       어긋나므로 되돌린다(포털의 #app 은 내용만큼만 차지하고 남는 높이는 flex 가 준다). */
  main#app{height:auto}

  /* ══ PC 모드 (2026-09-03) — 레거시 PartnerERP 처럼 상단 가로 메뉴바 ══
     ★모바일 마크업은 그대로 두고 CSS 로 갈아끼운다(나중에 모바일 전환 대비).
       body.pc  = PC 레이아웃(가로메뉴 + 넓은 그리드) · 없으면 종전 모바일. */
  /* ★nav 가 HTML 상 main 뒤에 있다(모바일=하단탭). PC 에선 flex order 로 헤더 바로 밑에 올린다
       — HTML 순서를 바꾸지 않아야 모바일 레이아웃이 그대로 산다. */
  body.pc{padding-bottom:0;background:#eef1f6;display:flex;flex-direction:column;min-height:100vh}
  body.pc header{order:1}
  body.pc nav   {order:2}
  body.pc main  {order:3;flex:1 1 auto}   /* #app·#erp 둘 다 — 헤더/메뉴 아래를 채운다 */
  body.pc #login{order:0;flex:1 1 auto}   /* 로그인 화면은 PC 에서도 화면 채움 */
  /* 레거시 PartnerERP 메뉴줄 모양 — 작은 글씨·촘촘·회색바탕·구분선 없음 */
  body.pc nav{position:sticky;top:0;z-index:29;border-top:0;border-bottom:1px solid #b9bfc9;
    background:#f0f0f0;padding:0 2px;overflow-x:auto;white-space:nowrap}
  body.pc nav button{flex:0 0 auto;flex-direction:row;gap:4px;padding:5px 11px;
    font-size:12.5px;font-weight:500;color:#1f2937;border:0;border-radius:0;line-height:1.5}
  /* ★PC 는 글자만 — 레거시 메뉴줄과 동일. (CLAUDE §3 아이콘 금지) 모바일 탭은 아이콘 유지 */
  body.pc nav button .i{display:none}
  body.pc nav button:hover{background:#dde7f5}
  body.pc nav button.on{background:var(--brand);color:#fff;font-weight:700}
  body.pc main#app{max-width:none;padding:8px 10px 14px;margin:0}
  body.pc #erp{padding:0}   /* 내부 화면은 자기 여백을 쓴다 — 바깥에서 padding 을 주지 않는다 */
  /* 상단 제목줄 — 레거시 타이틀바처럼 얇게 */
  body.pc header{padding:5px 12px;background:var(--brand)}
  body.pc header .t{font-size:13.5px}
  body.pc header .c{font-size:11.5px}

  /* ★.tbl / .tbar / .gwrap / .ttl 규칙을 전부 삭제했다(2026-09-03).
       내가 포털에 사본 화면(viewPPlan·viewDeliv·viewSledg)을 만들 때 넣은 것인데,
       사본을 폐기하고 내부 ERP 화면을 직접 부르게 되면서 **포털은 이 클래스를 하나도 안 쓴다**.
       그런데 포털 <style> 이 app.css 뒤에 있어 우선순위가 높아, 남겨두면 #erp 안의
       내부 화면 그리드·툴바만 덮어써 레이아웃을 깨뜨린다(실제로 거래명세서 발행 화면이
       툴바 세로쏟음 + 버튼 가로 100% 로 깨졌다). 그리드 스타일 정본 = css/app.css 하나뿐이다. */
  /* ═══ 포털 자체화면 전용 (홈·발주현황·송장·입고) ═══
     ★모든 선택자에 #app 스코프 필수(2026-09-03).
       .btn·.card·table·th,td·.msg·.empty 는 내부 ERP(app.css)도 쓰는 이름이다.
       스코프 없이 쓰면 포털 <style> 이 app.css 뒤에 있어 우선순위로 이겨,
       #erp 안의 내부 화면까지 덮어써 레이아웃이 깨진다(.btn{width:100%} 이 특히 치명적이었다).
       새 규칙을 넣을 때도 반드시 `#app` 으로 시작할 것. */
  #app .card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    box-shadow:var(--sh);padding:13px;margin-bottom:11px}
  #app .card h3{margin:0 0 9px;font-size:13.5px;color:var(--sub);font-weight:700;
    display:flex;align-items:center;gap:6px}
  #app .card h3 .n{margin-left:auto;color:var(--brand);font-size:16px;font-weight:800}

  #app .kpi{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:11px}
  #app .kpi div{background:var(--card);border:1px solid var(--line);border-radius:var(--r);
    padding:11px 8px;text-align:center;box-shadow:var(--sh)}
  #app .kpi b{display:block;font-size:21px;font-weight:800;color:var(--brand);line-height:1.15}
  #app .kpi span{font-size:11.5px;color:var(--sub)}

  #app table{width:100%;border-collapse:collapse;font-size:13.5px}
  #app th,#app td{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  #app th{font-size:11.5px;color:var(--sub);font-weight:700;background:#fafbfd;
    position:sticky;top:0}
  #app td.n,#app th.n{text-align:right;font-variant-numeric:tabular-nums}
  #app .scroll{max-height:62vh;overflow:auto;margin:0 -13px;padding:0 13px}
  #app .empty{padding:26px 10px;text-align:center;color:var(--sub);font-size:13.5px}
  #app .part{font-weight:700;letter-spacing:-.2px}
  #app .nm{color:var(--sub);font-size:11.5px;display:block;margin-top:1px}

  #app .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:800}
  #app .p00{background:#fdf3e2;color:var(--warn)}   #app .p10{background:#e7effb;color:var(--brand2)}
  #app .p20{background:#e6f2ff;color:#2a6fb0}       #app .p30{background:#fff2e0;color:var(--warn)}
  #app .p40{background:#f0e9fb;color:#6b4bb5}       #app .p90{background:#e4f5ec;color:var(--ok)}
  #app .p99{background:#fdecec;color:var(--bad)}

  #app .btn{width:100%;padding:12px;border:0;border-radius:11px;background:var(--brand);color:#fff;
    font-size:15px;font-weight:800}
  #app .btn:disabled{background:#b9c4d6}
  #app .btn.g{background:#fff;color:var(--brand);border:1.5px solid var(--brand)}
  #app .msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:11px;font-weight:600}
  #app .msg.e{background:#fdecec;color:var(--bad);border:1px solid #f3c9c9}
  #app .msg.k{background:#e4f5ec;color:var(--ok);border:1px solid #bfe6d1}
  /* 로그인 박스 버튼은 #app 밖이라 별도(포털 전용, 내부 화면과 무관) */
  #login .btn{width:100%;padding:12px;border:0;border-radius:11px;background:var(--brand);
    color:#fff;font-size:15px;font-weight:800}
  #login .btn:disabled{background:#b9c4d6}
  #login .msg{padding:10px 12px;border-radius:10px;font-size:13px;margin-bottom:11px;font-weight:600}
  #login .msg.e{background:#fdecec;color:var(--bad);border:1px solid #f3c9c9}

  /* ── 로그인 ── */
  #login{position:fixed;inset:0;z-index:60;background:linear-gradient(160deg,#1c47a0,#2f6db3);
    display:flex;align-items:center;justify-content:center;padding:22px}
  #login .box{width:100%;max-width:360px;background:#fff;border-radius:16px;padding:26px 22px}
  #login .lg{font-size:23px;font-weight:800;color:var(--brand);letter-spacing:-.4px}
  #login .sb{font-size:12.5px;color:var(--sub);margin:3px 0 20px}
  #login label{display:block;font-size:12px;font-weight:700;color:#43587e;margin:0 0 5px}
  #login input{width:100%;padding:12px;font-size:16px;border:1.5px solid #d7dfea;border-radius:10px;
    margin-bottom:13px}
  #login input:focus{outline:0;border-color:var(--brand2)}
  #app .foot,#login .foot{text-align:center;font-size:11.5px;color:var(--sub);padding:14px 10px 4px}

  /* 발행 · 스캔 — ★전부 #app 스코프(.row·.sum·.big 은 내부 ERP 도 쓸 법한 흔한 이름이다) */
  #app .row{display:flex;align-items:center;gap:9px;padding:10px 2px;border-bottom:1px solid var(--line)}
  #app .row input[type=checkbox]{width:21px;height:21px;flex:0 0 auto}
  #app .row .g{flex:1;min-width:0}
  #app .row .q{width:78px;padding:8px;font-size:15px;text-align:right;border:1.5px solid #d7dfea;
    border-radius:8px;font-variant-numeric:tabular-nums}
  #app .qr{text-align:center;padding:6px 0 2px}
  #app .qr svg{width:min(64vw,240px);height:auto;display:block;margin:0 auto}
  #app .qrv{font-size:20px;font-weight:800;letter-spacing:1px;margin-top:8px;font-variant-numeric:tabular-nums}
  #app .big{width:100%;padding:14px;font-size:19px;text-align:center;border:2px solid var(--brand);
    border-radius:11px;font-weight:800;letter-spacing:1px;font-variant-numeric:tabular-nums}
  #app .sum{display:flex;gap:9px;margin:10px 0}
  #app .sum div{flex:1;background:#f7f9fc;border:1px solid var(--line);border-radius:10px;
    padding:9px;text-align:center}
  #app .sum b{display:block;font-size:18px;font-weight:800;color:var(--brand)}
  #app .sum span{font-size:11px;color:var(--sub)}
  #app .warnbox{background:#fdf3e2;border:1px solid #f0d6a8;color:#8a5600;padding:11px;
    border-radius:10px;font-size:13px;font-weight:700;margin-bottom:11px;line-height:1.5}
  /* 포털 모달은 body 직속으로 뜬다(#app 밖) — 포털 전용 id 를 함께 걸어 내부 화면과 겹치지 않게 */
  .pmodal{position:fixed;inset:0;z-index:70;background:rgba(16,32,60,.55);display:flex;
    align-items:flex-end;justify-content:center;padding:0}
  .pmodal .sheet{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;
    padding:18px 15px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}
  .pmodal h4{margin:0 0 4px;font-size:17px;font-weight:800}
  .pmodal .s{color:var(--sub);font-size:12.5px;margin-bottom:13px}

  /* ───────── 내부 ERP 화면을 그대로 심는 자리 ─────────
     SCREEN.xxx(container) 가 그린 결과는 app.css 규칙으로 스타일된다.
     포털은 그 바깥(헤더·메뉴바)만 책임진다. */
  /* ★#erp 안(내부 ERP 화면)에는 포털 CSS 가 개입하지 않는다.
       컨테이너의 크기·표시만 정하고, 내용의 레이아웃은 전부 app.css 와 화면 코드에 맡긴다.
       (앞서 `#erp > div{flex-direction:column}` 을 넣었다가 내부 툴바가 세로로 쏟아졌다 —
        내부 화면 루트는 자기 구조가 있으므로 바깥에서 flex 를 강제하면 안 된다.) */
  #erp{display:none;padding:0}
  body.erpview #app{display:none}
  /* ★내부 ERP 의 `.content`(flex:1;overflow:auto;min-height:0)와 **같게** 만든다.
       화면 코드가 그 환경을 전제로 짜여 있으므로, 다르게 주면 화면마다 다른 방식으로 깨진다.
       (헤더·메뉴가 잘리던 문제는 body.pc.erpview 를 100vh 로 가두고 sticky 를 static 으로
        바꿔 해결했다 — #erp 의 스크롤을 없애는 방식이 아니었다.) */
  body.erpview #erp{display:flex;flex-direction:column;flex:1 1 auto;min-height:0;overflow:auto}
  /* ★#erp 의 자식에 height 를 강제하지 않는다(2026-09-03).
       화면마다 루트 구조가 다르다:
         · partnerplan → 단일 래퍼 <div class="pn-root" style="height:100%"> 하나
         · deliv420    → 래퍼 없이 .page-title / .page-sub / .toolbar / 그리드가 **형제로 나열**
       `#erp>*{height:100%}` 를 주면 후자에서 **제목 하나가 화면 전체를 차지**해
       툴바·그리드가 화면 밖으로 밀린다(실제 증상: 제목만 하단에 덩그러니).
       ⟹ #erp 는 flex 컨테이너 역할만 하고, 높이 배분은 각 화면의 flex 값(0 0 auto / 1)에 맡긴다.
          내부 ERP(index.html)의 .content(flex:1;overflow:auto;min-height:0)와 같은 방식이다. */
  body.erpview #erp>*{min-height:0}
  /* 단일 래퍼로 감싼 화면(.pn-root 처럼 height:100% 를 쓰는 것)만 실제 높이를 받는다. */
  body.erpview #erp>.pn-root{height:100%;flex:1 1 auto}
  /* PC 에선 페이지 전체가 100vh 안에 갇힌다 = 헤더·메뉴는 항상 제자리, 스크롤은 그리드 안에서만.
     (CLAUDE §3 「페이지 본문 세로 스크롤 금지」와 같은 규칙) */
  body.pc.erpview{height:100vh;min-height:0;overflow:hidden}
  body.pc.erpview header,body.pc.erpview nav{flex:0 0 auto;position:static}
</style>
</head>
<body>

<div id="login">
  <div class="box">
    <div class="lg">PNC 협력사</div>
    <div class="sb">피앤씨인더스트리 협력사 포털</div>
    <div id="lgerr" class="msg e hide"></div>
    <label>아이디</label>
    <input id="lgid" autocomplete="username" autocapitalize="off" placeholder="예) p2096">
    <label>비밀번호</label>

(function(){
const API = location.origin;
/* ★토큰은 두 곳에 함께 쓴다(2026-09-03).
     포털 자체 api() 는 ptok 을, core.js 의 fetch 래퍼는 auth_token 을 읽는다.
     내부 ERP 화면(SCREEN.xxx)이 부르는 API 는 core.js 래퍼를 타므로 auth_token 이 없으면 401 이 난다.

const T = {
  get tok(){ try{return localStorage.getItem('ptok')||''}catch(e){return ''} },
  set tok(v){ try{
      if(v){ localStorage.setItem('ptok',v);  localStorage.setItem('auth_token',v); }
      else { localStorage.removeItem('ptok'); localStorage.removeItem('auth_token'); }
    }catch(e){} },
  get me(){ try{return JSON.parse(localStorage.getItem('pme')||'null')}catch(e){return null} },
  set me(v){ try{
      if(v){ localStorage.setItem('pme',JSON.stringify(v));  localStorage.setItem('auth_user',JSON.stringify(v)); }
      else { localStorage.removeItem('pme'); localStorage.removeItem('auth_user'); }
    }catch(e){} },
};
const $ = s => document.querySelector(s);
const esc = s => (s==null?'':String(s)).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const num = n => (n==null||n==='')?'-':Number(n).toLocaleString('ko-KR',{maximumFractionDigits:0});

async function api(path, opt){
  opt = opt||{};
  const h = Object.assign({'Content-Type':'application/json'}, opt.headers||{});
  if(T.tok) h['Authorization'] = 'Bearer '+T.tok;
  const r = await fetch(API+path, Object.assign({}, opt, {headers:h}));
  let j = null; try{ j = await r.json(); }catch(e){}
  if(r.status===401){ T.tok=null; T.me=null; showLogin('로그인이 만료되었습니다. 다시 로그인해 주세요.'); throw new Error('401'); }
  if(!r.ok) throw new Error((j&&j.detail)||('오류 '+r.status));

}

  try{
    const r = await fetch(API+'/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},

/* ★내부 ERP 런타임(core.js)을 포털 계정으로 맞춘다(2026-09-03).

function syncErpRuntime(){
  const u = T.me || {};
  try{
    /* ★★★토큰 동기화가 먼저다(2026-09-03 — 업체 자동입력이 안 되던 진짜 원인).

         = localStorage.auth_token 을 읽는다. 포털은 ptok 에 저장하면서 T.tok setter 에서
         auth_token 도 같이 쓰지만, **이미 로그인된 세션은 setter 가 다시 안 불린다.**
         그러면 auth_token 이 빈 채로 요청이 나가 서버가 '비로그인'으로 처리하고,
         scope_cust 가 협력사 강제를 못 해 workcenters 가 103건(직원 전체)으로 돌아온다.

         ⟹ 시작할 때마다 무조건 맞춘다. */
    if(typeof AUTH !== 'undefined'){
      if(T.tok && AUTH.token !== T.tok) AUTH.token = T.tok;

    }
    if(typeof PERM !== 'undefined' && u.id){

    }
  }catch(e){}
}

/* ★홈 로딩 체감 개선(2026-09-03)
     서버 쿼리 자체는 웜에서 0.2~0.3초로 빠르다(콜드 첫 호출만 7초). 느리게 느껴지던 건

     캐시는 이 탭·이 세션에서만 살고(sessionStorage), 계정이 다르면 버린다. */
const _MYK='pnc_my_cache';
function _myCacheGet(){
  try{
    const s=sessionStorage.getItem(_MYK); if(!s) return null;
    const j=JSON.parse(s);
    if(!j || j.uid!==((T.me||{}).id||'') ) return null;      // 다른 계정 캐시는 버린다
    if(Date.now()-(j.at||0) > 10*60*1000) return null;        // 10분 지나면 버린다
    return j.d||null;
  }catch(e){ return null; }
}
function _myCacheSet(d){
  try{ sessionStorage.setItem(_MYK, JSON.stringify(
        {uid:((T.me||{}).id||''), at:Date.now(), d:d})); }catch(e){}
}

async function load(){

  const cached=_myCacheGet();
  if(cached){ DATA=cached; render(); }             // 있으면 먼저 그린다(대기 없음)
  else {
    /* ★첫 로그인 체감속도(2026-09-03 사용자 지적 "최초 로그인시 많이 느려").
       실측: /api/partner/my 는 콜드 7.9초 · 웜 0.2초 — DB 커넥션 워밍이라 화면으로는 못 줄인다.
       그런데 종전엔 그 7.9초 동안 **메뉴바조차 안 나왔다**(render 가 `if(!DATA) return`).
       메뉴는 로그인 정보(T.me)만으로 그릴 수 있다 → 먼저 그려서 바로 다른 화면으로 갈 수 있게 한다.
       홈 카드만 '불러오는 중…' 으로 남는다. */
    drawNav();
    $('#app').innerHTML = '<div class="card"><div class="empty">불러오는 중…</div></div>';
  }
  try{ DATA = await api('/api/partner/my?days=14'); _myCacheSet(DATA); }
  catch(e){
    if(e.message==='401') return;
    if(!cached){ $('#app').innerHTML=`<div class="msg e">${esc(e.message)}</div>`; return; }
    return;                                        // 캐시가 있으면 그대로 두고 조용히 끝낸다
  }
  /* ★내부 ERP 화면을 보는 중이면 그 화면은 건드리지 않는다 — 메뉴만 갱신.

  render();
}

/* ★2026-09-03 — 메뉴 항목의 `scr` = **내부 ERP SCREEN id**.
     scr 가 있으면 포털이 화면을 그리지 않고 SCREEN.<scr>(#erp) 를 그대로 호출한다.

     소속 제한은 서버가 한다 — auth.scope_cust() 가 협력사면 partner_code 로 강제,

function tabs(){
  const staff = (T.me||{}).utype !== '협력사';
  const isPartner = !!((T.me||{}).partner_code);
  const isCutting = !!((T.me||{}).is_cutting);
  const t=[{v:'home',n:'홈'}];
  t.push({v:'pplan', n:'협력사 계획현황',      scr:'partnerplan'});

  if(isPartner && !isCutting) t.push({v:'order', n:'협력사 발주현황(일반)'});
  t.push({v:'deliv', n:'거래명세서 발행',      scr:'deliv420'});
  t.push({v:'dedit', n:'거래명세표 수정',      scr:'delivedit'});
  // ★「협력사사급재고관리」는 뺐다(2026-09-03) — 사급 수불장과 같은 원장(nx.sagub_maint)을
  //   보는 중복 화면이고, 수불장이 상위(입고·출고·잔량 + 일자별 이력)라 잔량 컬럼으로 갈음된다.
  t.push({v:'sledg', n:'사급 수불장',          scr:'sagubledger'});
  // 기존 모바일 화면 — 송장 발행은 여기서만 되므로 남긴다(거래명세서 발행과 별개 흐름).
  const useInv = staff || ((DATA && ((DATA.ready_cnt>0) || (DATA.inv||[]).length>0)) || false);
  if(useInv) t.push({v:'inv', n:'내 송장'});
  if(staff)  t.push({v:'scan', n:'입고'});

/* 내부 ERP 화면을 #erp 에 그린다. 실패해도 포털이 죽지 않게 감싼다.

      두 번째 조회는 홈 응답이 이미 끝난 뒤라 멀쩡했다 — 증상이 정확히 이 순서였다.
      ⟹ 이미 그 화면이 떠 있으면 컨테이너만 보이게 하고 화면 코드는 건드리지 않는다. */
/* ★내부 화면은 대부분 **비동기**다 — SCREEN.xxx(box) 를 부르면 planBase()·목록조회 등이 끝난 뒤에야
     box.innerHTML 을 채운다. 그래서 "box 가 비었으니 아직 안 그려졌다"로 판단하면 안 된다.
     그리는 중에 또 호출하면 먼저 시작한 비동기가 나중에 끝나며 서로 덮어써 **빈 화면**이 된다.
     ⟹ 「현재 화면 이름」만으로 판단하고, 호출은 화면당 한 번만 한다. */
let ERP_CUR='';
function renderErp(sid){
  const box=$('#erp');
  document.body.classList.add('erpview');
  box.classList.remove('hide');
  if(ERP_CUR===sid) return;        // ★이미 이 화면 = 그리는 중이든 다 그렸든 건드리지 않는다
  ERP_CUR=sid;                     // ★먼저 잠근다(비동기 렌더 중 재진입 차단)
  box.innerHTML='';
  const fn = (typeof SCREEN!=='undefined') && SCREEN[sid];
  if(typeof fn!=='function'){
    ERP_CUR='';
    box.innerHTML = `<div class="msg e" style="margin:14px">화면(${esc(sid)})을 불러오지 못했습니다.`
                  + ` 새로고침(Ctrl+F5) 후에도 같으면 전산담당에게 알려 주세요.</div>`;
    return;
  }
  try{ fn(box); }
  catch(e){
    ERP_CUR='';
    box.innerHTML = `<div class="msg e" style="margin:14px">화면 오류: ${esc(e.message||e)}</div>`;

}

/* 메뉴바만 그린다 — DATA 없이도 된다(로그인 정보만 쓴다).
   ★첫 로그인의 홈 응답(콜드 7.9초)을 기다리는 동안에도 메뉴는 눌러야 한다. */
function drawNav(){
  const T2=tabs();
  if(!T2.some(x=>x.v===VIEW)) VIEW='home';
  $('#nav').innerHTML = T2.map(x=>`<button data-v="${x.v}" class="${x.v===VIEW?'on':''}">${x.n}</button>`).join('');
  $('#nav').querySelectorAll('button').forEach(b=>b.onclick=()=>{
    VIEW=b.dataset.v;
    // 홈은 DATA 가 있어야 그린다. 아직 안 왔으면 메뉴 하이라이트만 바꾸고 기다린다.
    if(VIEW==='home' && !DATA){ drawNav(); return; }
    render(); window.scrollTo(0,0); });
  return T2;
}

function render(){
  const T2=drawNav();

  // ★내부 ERP 화면이면 여기서 끝 — 포털은 그리지 않는다(DATA 없이도 열린다).
  const cur = T2.find(x=>x.v===VIEW);
  if(cur && cur.scr){ $('#app').classList.add('hide'); renderErp(cur.scr); return; }

  if(!DATA) return;   // 포털 자체화면은 DATA 가 있어야 그린다

  document.body.classList.remove('erpview');
  $('#erp').classList.add('hide'); $('#erp').innerHTML=''; ERP_CUR='';   // 떠났으니 다음엔 새로 그린다
  $('#app').classList.remove('hide');
  // 포털 자체 화면(홈·발주현황·송장·입고) — 모바일 흐름 그대로.
  const V={home:viewHome, plan:viewPlan, order:viewOrder, scan:viewScan, inv:viewInv};
  $('#app').innerHTML = (V[VIEW]||viewHome)();
  wire();
}

/* ★계획 공통 기준일 = 마지막 계획업로드 파일의 일자축 첫날(2026-09-03).
     오늘(today)이 아니다 — 업로드 후 미출하분이 재편성되면서 재고 충당이 그쪽으로 옮겨가
     옛 날짜로 조회하면 재고가 실제보다 많이 채워져 보인다(order.py:295 근거).
     내부 ERP 의 planBase() 와 같은 소스(/api/plan/basedate)를 쓴다.
     ※계획현황 화면 자체는 내부 ERP SCREEN.partnerplan 이 제 planBase() 로 처리한다 —
       여기 값은 포털 홈 카드의 기준일 표시용으로만 남긴다. */
let PLAN_BASE='';
async function loadPlanBase(){
  try{
    const j=await api('/api/plan/basedate');      // {base_iso, base_ymd, src, upload_dt}
    const iso=(j&&j.base_iso)||'', y6=(j&&j.base_ymd)||'';
    PLAN_BASE = iso || (String(y6).length===6
      ? `20${y6.slice(0,2)}-${y6.slice(2,4)}-${y6.slice(4,6)}` : '');
  }catch(e){ PLAN_BASE=''; }
}

const _iso=(d)=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const _isoAdd=(iso,n)=>{const [y,m,d]=String(iso).split('-').map(Number);
  const t=new Date(y,(m||1)-1,(d||1)+n); return _iso(t);};
/* 일자 헤더 라벨 — 내부 ERP wlab(): 일2자리+요일 (예 27목). 주말은 빨강 */
const _WD=['일','월','화','수','목','금','토'];
const _dinfo=(y6)=>{const s=String(y6||'');
  if(s.length!==6) return {lab:s, wk:false};
  const dt=new Date(2000+ +s.slice(0,2), +s.slice(2,4)-1, +s.slice(4,6));
  const w=dt.getDay();
  return {lab:s.slice(4,6)+_WD[w], wk:(w===0||w===6)};};

/* ───────── 발주현황 : 순소요(계획−재고−기발주) ───────── */
function loadOrder(){

    .then(j=>{ ORDER=j; })
    .catch(e=>{ if(e.message!=='401') ORDER={error:e.message}; })
    .then(()=>{ ORDER_LOADING=false; if(VIEW==='order') render(); });
}
const net4 = r => Math.round((+r.plan_qty||0)-(+r.stock_qty||0)-(+r.po_qty||0));   // 4주 순소요
function viewOrder(){
  if(!ORDER){ loadOrder(); return `<div class="card"><div class="empty">불러오는 중…</div></div>`; }

  const rows = ORDER.rows||[];
  const need = rows.filter(r=>net4(r)>0).length;
  const totNet = rows.reduce((a,r)=>a+Math.max(0,net4(r)),0);
  return `
  <div class="kpi">
    <div><b>${num(rows.length)}</b><span>품목</span></div>

    ${rows.length ? `<div class="scroll"><table>
      <thead><tr><th>품목</th><th class="n">계획</th><th class="n">재고(당사)</th><th class="n" title="대상 협력사 사급 보유재고 합산 · 참고용(계산 미반영)">협력사재고</th><th class="n">기발주</th><th class="n">순소요</th></tr></thead>

        <td class="n">${num(r.plan_qty)}</td><td class="n">${num(r.stock_qty)}</td><td class="n" style="color:#5b7fa6" title="협력사 사급 보유(참고·계산 미반영)">${r.coop_stock<0?'(음수)0':(r.coop_stock>0?num(r.coop_stock):'-')}</td><td class="n">${num(r.po_qty)}</td>
        <td class="n" style="font-weight:800;color:${n>0?'#c0392b':'#8a94a6'}">${num(n)}</td></tr>`; }).join('')}</tbody>
    </table></div>` : `<div class="empty">발주현황 품목이 없습니다.</div>`}
  </div>
  <div class="foot">피앤씨인더스트리 · 계획·물동은 생산관리 기준</div>`;

  const items=Object.entries(SEL).map(([sheet,qty])=>({sheet,qty:Number(qty)||0}))
                                 .filter(x=>x.qty>0);

  const b=$('#issue'); b.disabled=true; b.textContent='발행 중…';

async function useCamera(){
  if(!('BarcodeDetector' in window)){
    alert('이 브라우저는 카메라 스캔을 지원하지 않습니다.\n리더기로 찍거나 번호를 직접 입력하세요.\n(안드로이드 크롬에서 지원)');
    return;
  }
  const m=document.createElement('div'); m.className='modal';
  m.innerHTML=`<div class="sheet"><h4>QR 을 비추세요</h4>
    <video id="v" playsinline style="width:100%;border-radius:12px;background:#000"></video>
    <button class="btn g" id="cx" style="margin-top:11px">닫기</button></div>`;
  document.body.appendChild(m);
  let stream=null, stop=false;
  const close=()=>{ stop=true; if(stream) stream.getTracks().forEach(t=>t.stop()); m.remove(); };
  m.querySelector('#cx').onclick=close;
  try{
    stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    const v=m.querySelector('#v'); v.srcObject=stream; await v.play();
    const det=new BarcodeDetector({formats:['qr_code','code_39']});
    const tick=async()=>{
      if(stop) return;
      try{ const c=await det.detect(v);
        if(c && c.length){ const val=(c[0].rawValue||'').replace(/[^0-9]/g,'');
          if(val){ close(); $('#sc').value=val; doScan(); return; } } }catch(e){}
      requestAnimationFrame(tick);
    };
    tick();
  }catch(e){ close(); alert('카메라를 열 수 없습니다 — '+e.message); }
}

/* ★포털 자체화면(홈·발주현황·송장·입고)의 배선만 남는다(2026-09-03).
     계획현황·거래명세서 발행/수정·사급 수불장은 내부 ERP SCREEN 이 자기 배선을 스스로 한다 —
     renderErp() 가 SCREEN.xxx(#erp) 를 부르면 그 안에서 이벤트까지 붙는다. */
function wire(){
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{ VIEW=b.dataset.go; render(); window.scrollTo(0,0); });
  document.querySelectorAll('[data-sheet]').forEach(cb=>cb.onchange=()=>{
    const sh=cb.dataset.sheet, q=document.querySelector(`[data-q="${sh}"]`);
    if(cb.checked) SEL[sh]=Number(q&&q.value)||0; else delete SEL[sh];
    recalc();
  });
  document.querySelectorAll('[data-q]').forEach(q=>q.oninput=()=>{
    const sh=q.dataset.q; if(SEL[sh]!=null) SEL[sh]=Number(q.value)||0; recalc();
  });
  document.querySelectorAll('[data-qr]').forEach(b=>b.onclick=()=>showQR(b.dataset.qr));
  const is=$('#issue'); if(is) is.onclick=doIssue;
  const g=$('#go'); if(g) g.onclick=doScan;
  const c=$('#cam'); if(c) c.onclick=useCamera;
  const sc=$('#sc'); if(sc){ sc.focus(); sc.onkeyup=e=>{ if(e.key==='Enter') doScan(); }; }
  recalc();
}

/* ───────── 시작 ───────── */
$('#lgbtn').onclick = doLogin;
['#lgid','#lgpw'].forEach(s=>$(s).addEventListener('keyup',e=>{ if(e.key==='Enter') doLogin(); }));
$('#out').onclick = async()=>{
  try{ await api('/api/auth/logout',{method:'POST',body:'{}'}); }catch(e){}
  T.tok=null; T.me=null; showLogin();
};

(async function(){
  if(!T.tok) return showLogin();
  try{ const j = await api('/api/auth/me'); T.me = j.user; $('#login').classList.add('hide'); start(); }
  catch(e){ showLogin(); }
})();
})();   /* ← 포털 스크립트 IIFE 끝 */
</script>
